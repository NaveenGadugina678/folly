  <style>
    /* ---------- Interests page extras (uses tokens from style.css) ---------- */
    .photo-intro { max-width: 56ch; margin: 0 auto; color: var(--text-soft); }

    .subject-tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 24px; }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 28px;
    }

    .photo-card {
      background: var(--background);
      border: 3px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 14px 18px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      cursor: pointer;
      text-align: left;
      font: inherit;
      color: inherit;
    }
    .photo-card:hover { transform: translateY(-6px) rotate(-1deg); box-shadow: var(--shadow-lg); }
    .photo-card:nth-child(even):hover { transform: translateY(-6px) rotate(1deg); }

    .photo-frame {
      position: relative;
      aspect-ratio: 4 / 3;
      border: 3px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.6rem;
    }
    .photo-frame img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .photo-frame--blue { background: var(--blue); }
    .photo-frame--peach { background: var(--peach); }
    .photo-frame--yellow { background: var(--yellow); }
    .photo-frame--coral { background: var(--coral); }

    .photo-title { font-family: var(--font-display); font-size: 1.15rem; font-weight: 700; margin: 14px 0 4px; }
    .photo-meta { color: var(--text-soft); font-size: 0.88rem; }

    /* ---------- Lightbox ---------- */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(17, 17, 17, 0.8);
    }
    .lightbox.open { display: flex; }
    .lightbox-box {
      position: relative;
      max-width: min(920px, 100%);
      max-height: 100%;
      background: var(--background);
      border: 3px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px;
      box-shadow: var(--shadow-lg);
    }
    .lightbox-box img {
      max-height: 72vh;
      width: auto;
      max-width: 100%;
      margin: 0 auto;
      border-radius: var(--radius-sm);
    }
    .lightbox-caption { text-align: center; font-weight: 600; margin-top: 12px; }
    .lightbox-close {
      position: absolute;
      top: -16px;
      right: -16px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: var(--coral);
      color: #FEFEFF;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
    }
    @media (max-width: 600px) { .lightbox-close { top: -12px; right: -6px; } }
  </style>

  <script src="script.js"></script>
  <script>
    // Lightbox: click a photo to view it larger; Esc, the X, or a click outside closes it
    (function () {
      const box = document.getElementById('lightbox');
      const img = document.getElementById('lightboxImg');
      const cap = document.getElementById('lightboxCaption');
      let lastCard = null;

      function open(card) {
        lastCard = card;
        img.src = card.dataset.full;
        img.alt = card.querySelector('img') ? card.querySelector('img').alt : '';
        cap.textContent = card.dataset.caption || '';
        box.classList.add('open');
        document.getElementById('lightboxClose').focus();
      }
      function close() {
        box.classList.remove('open');
        img.src = '';
        if (lastCard) lastCard.focus();
      }

      document.querySelectorAll('.photo-card').forEach((c) => c.addEventListener('click', () => open(c)));
      document.getElementById('lightboxClose').addEventListener('click', close);
      box.addEventListener('click', (e) => { if (e.target === box) close(); });
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && box.classList.contains('open')) close(); });
    })();
  </script>
